<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - hotels/tickets 上品工具</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .register-card {
            background: white;
            border-radius: 20px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }
        .register-card .logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        .register-card .logo i {
            font-size: 2.5rem;
            color: #4f46e5;
            background: #eef2ff;
            padding: 1rem;
            border-radius: 16px;
        }
        .register-card .logo h2 {
            font-weight: 700;
            color: #1e293b;
            margin-top: 1rem;
            font-size: 1.3rem;
        }
        .register-card .logo p {
            color: #94a3b8;
            font-size: 0.875rem;
            margin-bottom: 0;
        }
        .form-control {
            border-radius: 12px;
            padding: 0.75rem 1rem;
            border-color: #e2e8f0;
        }
        .form-control:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79,70,229,0.15);
        }
        .btn-primary {
            background: #4f46e5;
            border-color: #4f46e5;
            border-radius: 12px;
            padding: 0.75rem;
            font-weight: 600;
        }
        .btn-primary:hover {
            background: #4338ca;
            border-color: #4338ca;
        }
        .btn-outline-primary {
            border-radius: 12px;
            padding: 0.75rem;
            font-weight: 500;
        }
        .input-group .btn {
            border-radius: 12px;
            white-space: nowrap;
        }
        .divider {
            display: flex;
            align-items: center;
            color: #94a3b8;
            font-size: 0.8rem;
            margin: 1.5rem 0;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e2e8f0;
        }
        .divider::before { margin-right: 1rem; }
        .divider::after { margin-left: 1rem; }
        .toast-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;
        }
        .toast {
            border-radius: 12px;
            border: none;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
            min-width: 300px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="toast-container" id="toastContainer"></div>

    <div class="register-card">
        <div class="logo">
            <i class="bi bi-person-plus"></i>
            <h2>注册账号</h2>
            <p>注册后即可登录使用上品工具</p>
        </div>

        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="mb-3">
                <label class="form-label fw-medium" style="font-size:0.875rem;">邮箱</label>
                <input type="email" class="form-control" id="email" placeholder="请输入邮箱" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-medium" style="font-size:0.875rem;">验证码</label>
                <div class="input-group">
                    <input type="text" class="form-control" id="code" placeholder="请输入验证码" required maxlength="6">
                    <button type="button" class="btn btn-outline-primary" id="sendCodeBtn" onclick="sendCode()">
                        获取验证码
                    </button>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-medium" style="font-size:0.875rem;">设置密码</label>
                <input type="password" class="form-control" id="password" placeholder="至少6位密码" required minlength="6">
            </div>
            <div class="mb-4">
                <label class="form-label fw-medium" style="font-size:0.875rem;">确认密码</label>
                <input type="password" class="form-control" id="confirmPassword" placeholder="再次输入密码" required minlength="6">
            </div>
            <button type="submit" class="btn btn-primary w-100" id="registerBtn">
                <i class="bi bi-check-circle me-1"></i>注 册
            </button>
        </form>

        <div class="divider">已有账号？</div>

        <a href="/login.html" class="btn btn-outline-primary w-100">
            <i class="bi bi-box-arrow-in-right me-1"></i>返回登录
        </a>
    </div>

    <script>
    const API_BASE = '';

    function showToast(message, type = 'success') {
        const container = document.getElementById('toastContainer');
        const icons = { success: 'bi-check-circle-fill text-success', error: 'bi-x-circle-fill text-danger', info: 'bi-info-circle-fill text-primary' };
        const toast = document.createElement('div');
        toast.className = 'toast align-items-center show';
        toast.role = 'alert';
        toast.innerHTML = `<div class="d-flex"><div class="toast-body"><i class="bi ${icons[type] || icons.info} me-2"></i>${message}</div><button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button></div>`;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 4000);
    }

    function setLoading(btn, loading, text) {
        if (loading) {
            btn.dataset.originalHtml = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span>${text || '处理中...'}`;
        } else {
            btn.disabled = false;
            btn.innerHTML = btn.dataset.originalHtml || btn.innerHTML;
        }
    }

    let countdown = 0;
    let countdownTimer = null;

    function startCountdown(btn) {
        countdown = 60;
        btn.disabled = true;
        countdownTimer = setInterval(() => {
            countdown--;
            btn.innerHTML = `${countdown}s`;
            if (countdown <= 0) {
                clearInterval(countdownTimer);
                btn.disabled = false;
                btn.innerHTML = '获取验证码';
            }
        }, 1000);
    }

    async function sendCode() {
        const email = document.getElementById('email').value.trim();
        if (!email) {
            showToast('请输入邮箱', 'error');
            return;
        }

        const btn = document.getElementById('sendCodeBtn');
        setLoading(btn, true, '发送中...');
        try {
            const resp = await fetch(`${API_BASE}/api/auth/send-code`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, purpose: 'register' }),
            });
            const data = await resp.json();
            if (!resp.ok) {
                showToast(data.detail || '发送失败', 'error');
                return;
            }
            showToast(data.message, 'info');
            startCountdown(btn);
        } catch (e) {
            showToast('网络错误，请检查服务是否启动', 'error');
        } finally {
            setLoading(btn, false);
        }
    }

    async function handleRegister(e) {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const code = document.getElementById('code').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (!email) {
            showToast('请输入邮箱', 'error');
            return;
        }
        if (!code) {
            showToast('请输入验证码', 'error');
            return;
        }
        if (password.length < 6) {
            showToast('密码至少6位', 'error');
            return;
        }
        if (password !== confirmPassword) {
            showToast('两次密码输入不一致', 'error');
            return;
        }

        const btn = document.getElementById('registerBtn');
        setLoading(btn, true, '注册中...');
        try {
            const resp = await fetch(`${API_BASE}/api/auth/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, code, password }),
            });
            const data = await resp.json();
            if (!resp.ok) {
                showToast(data.detail || '注册失败', 'error');
                return;
            }
            showToast(`注册成功！您的账号：${data.account_no}`, 'success');
            setTimeout(() => {
                window.location.href = '/login.html';
            }, 1500);
        } catch (e) {
            showToast('网络错误，请检查服务是否启动', 'error');
        } finally {
            setLoading(btn, false);
        }
    }
    </script>
</body>
</html>

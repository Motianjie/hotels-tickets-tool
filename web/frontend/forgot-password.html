<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找回密码 - hotels/tickets 上品工具</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            border: none;
        }
        .card .logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        .card .logo i {
            font-size: 2.5rem;
            color: #4f46e5;
            background: #eef2ff;
            padding: 1rem;
            border-radius: 16px;
        }
        .card .logo h2 {
            font-weight: 700;
            color: #1e293b;
            margin-top: 1rem;
            font-size: 1.3rem;
        }
        .card .logo p {
            color: #94a3b8;
            font-size: 0.875rem;
            margin-bottom: 0;
        }
        .form-control {
            border-radius: 12px;
            padding: 0.75rem 1rem;
            border-color: #e2e8f0;
        }
        .form-control:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79,70,229,0.15);
        }
        .btn-primary {
            background: #4f46e5;
            border-color: #4f46e5;
            border-radius: 12px;
            padding: 0.75rem;
            font-weight: 600;
        }
        .btn-primary:hover {
            background: #4338ca;
            border-color: #4338ca;
        }
        .btn-outline-primary {
            border-radius: 12px;
            padding: 0.75rem;
            font-weight: 500;
        }
        .input-group .btn {
            border-radius: 12px;
            white-space: nowrap;
        }
        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }
        .step-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #e2e8f0;
            transition: all 0.3s;
        }
        .step-dot.active {
            background: #4f46e5;
            width: 28px;
            border-radius: 5px;
        }
        .step-dot.done {
            background: #22c55e;
        }
        .toast-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;
        }
        .toast {
            border-radius: 12px;
            border: none;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
            min-width: 300px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="toast-container" id="toastContainer"></div>

    <div class="card">
        <div class="logo">
            <i class="bi bi-key"></i>
            <h2>找回密码</h2>
            <p>验证身份后重置密码</p>
        </div>

        <!-- 步骤指示器 -->
        <div class="step-indicator">
            <div class="step-dot active" id="step1Dot"></div>
            <div class="step-dot" id="step2Dot"></div>
            <div class="step-dot" id="step3Dot"></div>
        </div>

        <!-- 步骤1：输入邮箱 -->
        <div id="step1">
            <form id="step1Form" onsubmit="handleStep1(event)">
                <div class="mb-4">
                    <label class="form-label fw-medium" style="font-size:0.875rem;">邮箱</label>
                    <input type="email" class="form-control" id="email" placeholder="请输入注册时使用的邮箱" required>
                </div>
                <button type="submit" class="btn btn-primary w-100" id="step1Btn">
                    <i class="bi bi-send me-1"></i>获取验证码
                </button>
            </form>
        </div>

        <!-- 步骤2：输入验证码 -->
        <div id="step2" style="display:none;">
            <form id="step2Form" onsubmit="handleStep2(event)">
                <div class="mb-3">
                    <label class="form-label fw-medium" style="font-size:0.875rem;">验证码</label>
                    <p style="font-size:0.8rem;color:#94a3b8;" id="codeSentTo">已发送至 138****0000</p>
                    <div class="input-group">
                        <input type="text" class="form-control" id="code" placeholder="请输入验证码" required maxlength="6">
                        <button type="button" class="btn btn-outline-primary" id="resendBtn" onclick="resendCode()">
                            重新发送
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100" id="step2Btn">
                    <i class="bi bi-arrow-right me-1"></i>验证
                </button>
            </form>
        </div>

        <!-- 步骤3：设置新密码 -->
        <div id="step3" style="display:none;">
            <form id="step3Form" onsubmit="handleStep3(event)">
                <div class="mb-3">
                    <label class="form-label fw-medium" style="font-size:0.875rem;">新密码</label>
                    <input type="password" class="form-control" id="newPassword" placeholder="至少6位密码" required minlength="6">
                </div>
                <div class="mb-4">
                    <label class="form-label fw-medium" style="font-size:0.875rem;">确认新密码</label>
                    <input type="password" class="form-control" id="confirmPassword" placeholder="再次输入新密码" required minlength="6">
                </div>
                <button type="submit" class="btn btn-primary w-100" id="step3Btn">
                    <i class="bi bi-check-circle me-1"></i>重置密码
                </button>
            </form>
        </div>

        <div class="text-center mt-3">
            <a href="/login.html" style="font-size:0.85rem;color:#4f46e5;text-decoration:none;">
                <i class="bi bi-arrow-left me-1"></i>返回登录
            </a>
        </div>
    </div>

    <script>
    const API_BASE = '';
    let verifiedEmail = '';
    let countdown = 60;
    let countdownTimer = null;

    function showToast(message, type = 'success') {
        const container = document.getElementById('toastContainer');
        const icons = { success: 'bi-check-circle-fill text-success', error: 'bi-x-circle-fill text-danger', info: 'bi-info-circle-fill text-primary' };
        const toast = document.createElement('div');
        toast.className = 'toast align-items-center show';
        toast.role = 'alert';
        toast.innerHTML = `<div class="d-flex"><div class="toast-body"><i class="bi ${icons[type] || icons.info} me-2"></i>${message}</div><button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button></div>`;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 4000);
    }

    function setLoading(btn, loading, text) {
        if (loading) {
            btn.dataset.originalHtml = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span>${text || '处理中...'}`;
        } else {
            btn.disabled = false;
            btn.innerHTML = btn.dataset.originalHtml || btn.innerHTML;
        }
    }

    function updateStep(step) {
        for (let i = 1; i <= 3; i++) {
            const dot = document.getElementById(`step${i}Dot`);
            const panel = document.getElementById(`step${i}`);
            dot.className = 'step-dot';
            if (i < step) {
                dot.classList.add('done');
                panel.style.display = 'none';
            } else if (i === step) {
                dot.classList.add('active');
                panel.style.display = 'block';
            } else {
                panel.style.display = 'none';
            }
        }
    }

    function startCountdown(btn) {
        countdown = 60;
        btn.disabled = true;
        countdownTimer = setInterval(() => {
            countdown--;
            btn.innerHTML = `${countdown}s`;
            if (countdown <= 0) {
                clearInterval(countdownTimer);
                btn.disabled = false;
                btn.innerHTML = '重新发送';
            }
        }, 1000);
    }

    // 步骤1：发送验证码
    async function handleStep1(e) {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        if (!email) {
            showToast('请输入邮箱', 'error');
            return;
        }

        const btn = document.getElementById('step1Btn');
        setLoading(btn, true, '发送中...');
        try {
            const resp = await fetch(`${API_BASE}/api/auth/send-code`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, purpose: 'reset_password' }),
            });
            const data = await resp.json();
            if (!resp.ok) {
                showToast(data.detail || '发送失败', 'error');
                return;
            }
            showToast(data.message, 'info');
            verifiedEmail = email;
            // 显示邮箱
            document.getElementById('codeSentTo').textContent = `已发送至 ${email}`;
            updateStep(2);
            document.getElementById('code').focus();
            startCountdown(document.getElementById('resendBtn'));
        } catch (e) {
            showToast('网络错误，请检查服务是否启动', 'error');
        } finally {
            setLoading(btn, false);
        }
    }

    // 重新发送验证码
    async function resendCode() {
        if (!verifiedEmail) return;
        const btn = document.getElementById('resendBtn');
        setLoading(btn, true, '发送中...');
        try {
            const resp = await fetch(`${API_BASE}/api/auth/send-code`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: verifiedEmail, purpose: 'reset_password' }),
            });
            const data = await resp.json();
            if (!resp.ok) {
                showToast(data.detail || '发送失败', 'error');
                return;
            }
            showToast(data.message, 'info');
            startCountdown(btn);
        } catch (e) {
            showToast('网络错误', 'error');
        } finally {
            setLoading(btn, false);
        }
    }

    // 步骤2：验证验证码
    async function handleStep2(e) {
        e.preventDefault();
        const code = document.getElementById('code').value.trim();
        if (!code) {
            showToast('请输入验证码', 'error');
            return;
        }

        const btn = document.getElementById('step2Btn');
        setLoading(btn, true, '验证中...');
        try {
            updateStep(3);
            document.getElementById('newPassword').focus();
        } finally {
            setLoading(btn, false);
        }
    }

    // 步骤3：重置密码
    async function handleStep3(e) {
        e.preventDefault();
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const code = document.getElementById('code').value.trim();

        if (newPassword.length < 6) {
            showToast('密码至少6位', 'error');
            return;
        }
        if (newPassword !== confirmPassword) {
            showToast('两次密码输入不一致', 'error');
            return;
        }

        const btn = document.getElementById('step3Btn');
        setLoading(btn, true, '重置中...');
        try {
            const resp = await fetch(`${API_BASE}/api/auth/reset-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: verifiedEmail,
                    code: code,
                    new_password: newPassword,
                }),
            });
            const data = await resp.json();
            if (!resp.ok) {
                showToast(data.detail || '重置失败', 'error');
                return;
            }
            showToast('密码重置成功！请重新登录', 'success');
            setTimeout(() => {
                window.location.href = '/login.html';
            }, 1500);
        } catch (e) {
            showToast('网络错误，请检查服务是否启动', 'error');
        } finally {
            setLoading(btn, false);
        }
    }
    </script>
</body>
</html>
